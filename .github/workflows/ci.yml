name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  racket:
    # What the package catalog's build server does, plus the anvil tests.
    name: Racket ${{ matrix.racket-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 8.8 is the floor declared in info.rkt.
        racket-version: ["8.8", "stable"]
        experimental: [false]
        include:
          - racket-version: current
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ matrix.racket-version }}
      - uses: foundry-rs/foundry-toolchain@v1.9.1
      # A full setup, as for users: keccak builds its C library in its
      # pre-install step, which `raco setup --pkgs web3` alone would skip.
      - name: Install web3 and its dependencies
        run: raco pkg install --batch --auto --link --name web3 "$GITHUB_WORKSPACE"
      - name: Check dependencies (with docs)
        run: raco setup --check-pkg-deps --unused-pkg-deps --pkgs web3
      - name: Test (unit and anvil integration)
        run: raco test -x -p web3

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Hermetic build and tests
        run: nix build -L
